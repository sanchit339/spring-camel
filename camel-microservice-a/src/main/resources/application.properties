spring.application.name=camel-microservice-a

# ActiveMQ broker used by Camel's activemq component.
# Spring Boot builds a ConnectionFactory from this URL and Camel reuses it,
# so routes can simply use activemq:queue:my-queue.
spring.activemq.broker-url=tcp://localhost:61616

# Kafka broker for Camel's kafka component.
# Pattern for component options: camel.component.<component-name>.<option>
camel.component.kafka.brokers=localhost:9092

# Custom property, read by ConfigExample.java as {{logger-path}}.
# It can be any Camel endpoint, e.g. log:my-log or seda:my-queue.
logger-path=log:example-log

# ---------------------------------------------------------------------------
# Running Camel as a standalone (non-web) application
# ---------------------------------------------------------------------------
# This project uses spring-boot-starter-webmvc, so Tomcat already keeps the JVM
# alive and the options below are NOT needed here. Uncomment them only when
# running Camel without a web server (plain Java / camel-main style):
#
#   main-run-controller  -> keep the JVM running until Ctrl+C / shutdown
#   duration-max-seconds -> stop the Camel routes after N seconds
#                           (in a web app the server may keep the JVM alive)
#
# In Camel 4 the prefix is camel.main.*. The old camel.springboot.* prefix is
# no longer read, and the option name is duration-max-seconds (plural).
# camel.main.main-run-controller=true
# camel.main.duration-max-seconds=60

# ---------------------------------------------------------------------------
# Logging
# ---------------------------------------------------------------------------
# Levels from most to least verbose: TRACE < DEBUG < INFO < WARN < ERROR.
# The most specific logger name wins, so these override the root level.
logging.level.org.springframework=INFO
logging.level.org.apache.camel.spring.boot=INFO

# Camel internals. DEBUG/TRACE is very chatty - use it only while debugging.
logging.level.org.apache.camel.impl=DEBUG

# The log: component logs with the logger name given in the URI, so
# "log:example-log" can be tuned with a line like the one below:
# logging.level.example-log=DEBUG

# Example only: this project has no AMQP/RabbitMQ dependency, so it does nothing.
# logging.level.org.springframework.amqp.rabbit=DEBUG
